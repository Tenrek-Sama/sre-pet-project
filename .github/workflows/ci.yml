name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: |
          echo "🔍 Checking Python syntax..."
          find . -name "*.py" -not -path "./.venv/*" -print0 | while IFS= read -r -d '' file; do
            python -c "import ast; ast.parse(open('$file').read())" || {
              echo "❌ Syntax error in $file"
              exit 1
            }
            echo "  ✅ $file"
          done

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: pet-project:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image
        run: |
          echo "✅ Image built successfully"
          docker images | grep pet-project

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Start services
        run: |
          docker compose up -d
          echo "⏳ Waiting for services..."
          sleep 15
      - name: Health check
        run: |
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8000/items || exit 1
          curl -f -X POST "http://localhost:8000/items?name=ci_test&value=42" || exit 1
          echo "✅ Integration tests passed"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Cleanup
        if: always()
        run: docker compose down -v
